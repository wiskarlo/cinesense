<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | CineSense</title>
  <link rel="stylesheet" href="style.css">
  <script src="movies-data.js"></script>
</head>

<body>
  <nav class="cs-nav">
    <div style="display:flex; align-items:center; gap:1.5rem;">
      <a href="index.html" class="cs-brand">CineSense</a>
    </div>
    
    <div class="cs-nav-search">
      <input type="text" id="text-search-input" placeholder="Search by title, director, keywords..." oninput="runPrimarySearch()">
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <span class="cs-user-pill" id="dashboard-user"></span>
      <button class="btn-signout" onclick="handleSignOut()">Sign Out</button>
    </div>
  </nav>

  <div class="dashboard-wrap">
    <div class="primary-search-panel">
      <div class="search-criteria-grid">
        <div class="criteria-selector">
          <select id="filter-genre" onchange="runPrimarySearch()">
            <option value="ALL">All Genres</option>
            <option value="Action">Action</option>
            <option value="Animation">Animation</option>
            <option value="Crime">Crime</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Adventure">Adventure</option>
            <option value="Family">Family</option>
          </select>
        </div>

        <div class="criteria-selector">
          <select id="filter-style" onchange="runPrimarySearch()">
            <option value="ALL">All Styles</option>
            <option value="Live-Action">Live-Action</option>
            <option value="Animation">Animation</option>
            <option value="Noir / Dark">Noir / Dark</option>
            <option value="Experimental">Experimental</option>
          </select>
        </div>

        <div class="criteria-selector">
          <select id="filter-age" onchange="runPrimarySearch()">
            <option value="ALL">All Age Ratings</option>
            <option value="G">G</option>
            <option value="PG">PG</option>
            <option value="PG-13">PG-13</option>
            <option value="R">R</option>
          </select>
        </div>

        <div class="criteria-selector">
          <select id="filter-era" onchange="runPrimarySearch()">
            <option value="ALL">All Eras</option>
            <option value="Classic">Classic Era | &lt;1980</option>
            <option value="Retro 80s-90s">Retro Era | 1980 – 1999</option>
            <option value="2000s">Modern Era | 2000 – 2015</option>
            <option value="Contemporary">Contemporary | 2016 – Present</option>
          </select>
        </div>

        <div>
          <button class="btn-reset-filters" onclick="resetFilters()">Reset</button>
        </div>
      </div>
    </div>

    <div class="tag-control-bar">
      <div class="tag-dropdown-group">
        <label style="font-size: 0.85rem; color: var(--cs-text-muted);">Optional Tag Filter:</label>
        <select id="community-tag-select" onchange="filterByDropdownTag(this.value)">
          <option value="ALL">Show All Tags</option>
        </select>
      </div>

      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 0.8rem; color: var(--cs-text-muted);">Preferred Tags:</span>
        <div class="active-preference-chips" id="preference-chips"></div>
      </div>
    </div>

    <div class="shelf-header">
      <span id="results-heading">Search Results</span>
      <span class="shelf-tag" id="results-count-tag">Showing all titles</span>
    </div>

    <div class="movie-shelf" id="shelf-primary-results"></div>

    <div class="shelf-header">
      <span>Stylized Visuals &amp; Animation</span>
      <span class="shelf-tag">Style Criterion: Animation</span>
    </div>
    <div class="movie-shelf" id="shelf-animation"></div>

    <div class="shelf-header">
      <span>Dark Noir &amp; Retro Crime</span>
      <span class="shelf-tag">Style: Noir / Era: Retro</span>
    </div>
    <div class="movie-shelf" id="shelf-noir"></div>
  </div>

  <div class="modal-backdrop" id="movie-modal" onclick="closeMovieModal()">
    <div class="modal-window" onclick="event.stopPropagation()">
      <div class="modal-hero" id="modal-banner">
        <div class="modal-hero-tint"></div>
        <div class="modal-hero-title" id="modal-title"></div>
      </div>
      <div class="modal-content">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
          <div id="modal-meta" style="font-size: 0.85rem; color: var(--cs-text-muted);"></div>
          <div style="font-size: 1rem; color: #fde68a; font-weight: 700;" id="modal-score"></div>
        </div>

        <p style="font-size: 0.95rem; line-height: 1.6; color: #e9d5ff; margin-bottom: 1rem;" id="modal-desc"></p>

        <div class="modal-rating-container">
          <div class="modal-rating-label">
            Your Rating
            <span>Click a star to rate or update your profile score</span>
          </div>
          <div class="modal-star-group">
            <div id="modal-stars-wrapper" style="display: flex; gap: 3px;"></div>
            <div class="modal-rating-text" id="modal-rating-indicator">--</div>
          </div>
        </div>

        <h4 style="font-size: 0.85rem; text-transform: uppercase; color: var(--cs-text-muted); letter-spacing: 0.5px; margin-top: 1rem;">
          Community Tags (Click any tag to add to your Preferences)
        </h4>
        <div class="tag-badge-container" id="modal-tags-container"></div>

        <div style="margin-top: 2rem; text-align: right;">
          <button class="btn-primary" onclick="closeMovieModal()">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('dashboard-user').textContent = localStorage.getItem('cinesense_active_user') || 'Evaluator';

    let userPreferredTags = ["visually stunning", "masterpiece"];
    let currentFilterTag = "ALL";
    let activeMovie = null;

    function handleSignOut() {
      localStorage.removeItem('cinesense_active_user');
      localStorage.removeItem('cinesense_user');
      window.location.href = 'index.html';
    }

    function runPrimarySearch() {
      const query = (document.getElementById('text-search-input').value || '').toLowerCase().trim();
      const selectedGenre = document.getElementById('filter-genre').value;
      const selectedStyle = document.getElementById('filter-style').value;
      const selectedAge = document.getElementById('filter-age').value;
      const selectedEra = document.getElementById('filter-era').value;

      const filtered = movies.filter(movie => {
        const matchText = !query || 
          movie.title.toLowerCase().includes(query) ||
          movie.desc.toLowerCase().includes(query) ||
          movie.style.toLowerCase().includes(query) ||
          movie.genres.some(g => g.toLowerCase().includes(query));

        const matchGenre = (selectedGenre === 'ALL') || movie.genres.includes(selectedGenre);
        const matchStyle = (selectedStyle === 'ALL') || (movie.style === selectedStyle);
        const matchAge   = (selectedAge === 'ALL')   || (movie.age === selectedAge);
        const matchEra   = (selectedEra === 'ALL')   || (movie.era === selectedEra);
        const matchTag   = (currentFilterTag === 'ALL') || movie.tags.includes(currentFilterTag);

        return matchText && matchGenre && matchStyle && matchAge && matchEra && matchTag;
      });

      renderPrimaryShelf(filtered);
      document.getElementById('results-count-tag').textContent = `${filtered.length} titles found`;
    }

    function resetFilters() {
      document.getElementById('text-search-input').value = '';
      document.getElementById('filter-genre').value = 'ALL';
      document.getElementById('filter-style').value = 'ALL';
      document.getElementById('filter-age').value = 'ALL';
      document.getElementById('filter-era').value = 'ALL';
      currentFilterTag = 'ALL';
      document.getElementById('community-tag-select').value = 'ALL';
      runPrimarySearch();
      renderCuratedShelves();
    }

    function initializeTagDropdown() {
      const select = document.getElementById('community-tag-select');
      const allTags = new Set();
      movies.forEach(m => m.tags.forEach(t => allTags.add(t)));
      
      allTags.forEach(tag => {
        const option = document.createElement('option');
        option.value = tag;
        option.textContent = tag;
        select.appendChild(option);
      });
    }

    function filterByDropdownTag(tag) {
      currentFilterTag = tag;
      runPrimarySearch();
      renderCuratedShelves();
    }

    function renderPreferenceChips() {
      const container = document.getElementById('preference-chips');
      container.innerHTML = '';
      if (userPreferredTags.length === 0) {
        container.innerHTML = '<span style="font-size:0.75rem; color:var(--cs-text-dim);">No tags added yet.</span>';
        return;
      }
      userPreferredTags.forEach(tag => {
        const chip = document.createElement('div');
        chip.className = 'pref-chip';
        chip.innerHTML = `${tag} <span onclick="removePreferenceTag('${tag}')">×</span>`;
        container.appendChild(chip);
      });
    }

    function addPreferenceTag(tag) {
      if (!userPreferredTags.includes(tag)) {
        userPreferredTags.push(tag);
        renderPreferenceChips();
        runPrimarySearch();
        renderCuratedShelves();
        if (activeMovie) {
          renderModalTags(activeMovie);
          document.getElementById('modal-score').textContent = `Predicted Affinity: ${computeMatchScore(activeMovie)}%`;
        }
      }
    }

    function removePreferenceTag(tag) {
      userPreferredTags = userPreferredTags.filter(t => t !== tag);
      renderPreferenceChips();
      runPrimarySearch();
      renderCuratedShelves();
      if (activeMovie) {
        renderModalTags(activeMovie);
        document.getElementById('modal-score').textContent = `Predicted Affinity: ${computeMatchScore(activeMovie)}%`;
      }
    }

    function computeMatchScore(movie) {
      let score = 70;
      if (movie.userRating > 0) score += (movie.userRating - 3) * 6;
      movie.tags.forEach(t => {
        if (userPreferredTags.includes(t)) score += 8;
      });
      return Math.min(Math.max(score, 45), 99);
    }

    function buildMovieCard(movie) {
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.onclick = () => openMovieModal(movie);

      const match = computeMatchScore(movie);
      const ratingSnippet = movie.userRating > 0 ? `&bull; ★ ${movie.userRating}.0` : '';

      card.innerHTML = `
        <div class="poster-box">
          <span class="match-chip">${match}% Match</span>
          <img src="${movie.img}" alt="${movie.title}">
        </div>
        <div class="card-details">
          <div class="card-title">${movie.title}</div>
          <div class="card-sub">${movie.year} &bull; ${movie.age} &bull; ${movie.style} ${ratingSnippet}</div>
        </div>
      `;
      return card;
    }

    function renderPrimaryShelf(movieList) {
      const shelf = document.getElementById('shelf-primary-results');
      shelf.innerHTML = '';
      if (movieList.length === 0) {
        shelf.innerHTML = '<div style="padding:1.5rem; color:var(--cs-text-muted); font-size:0.9rem;">No movies found for the criteria. Try adjusting a filter.</div>';
        return;
      }
      movieList.forEach(m => shelf.appendChild(buildMovieCard(m)));
    }

    function renderCuratedShelves() {
      const animShelf = document.getElementById('shelf-animation');
      const noirShelf = document.getElementById('shelf-noir');

      animShelf.innerHTML = '';
      noirShelf.innerHTML = '';

      movies.filter(m => m.style === 'Animation').forEach(m => animShelf.appendChild(buildMovieCard(m)));
      movies.filter(m => m.style === 'Noir / Dark' || m.genres.includes('Crime')).forEach(m => noirShelf.appendChild(buildMovieCard(m)));
    }

    function renderModalStarRating(movie) {
      const wrapper = document.getElementById('modal-stars-wrapper');
      const indicator = document.getElementById('modal-rating-indicator');
      wrapper.innerHTML = '';

      indicator.textContent = movie.userRating > 0 ? `${movie.userRating}.0 ★` : 'Not Rated';

      for (let star = 1; star <= 5; star++) {
        const starEl = document.createElement('span');
        starEl.className = `modal-star ${star <= movie.userRating ? 'rated' : ''}`;
        starEl.textContent = '★';

        starEl.onmouseover = () => {
          Array.from(wrapper.children).forEach((s, idx) => {
            s.classList.toggle('hovered', idx < star);
          });
        };

        starEl.onmouseout = () => {
          Array.from(wrapper.children).forEach(s => s.classList.remove('hovered'));
        };

        starEl.onclick = () => {
          movie.userRating = (movie.userRating === star) ? 0 : star;
          renderModalStarRating(movie);
          document.getElementById('modal-score').textContent = `Predicted Affinity: ${computeMatchScore(movie)}%`;
          runPrimarySearch();
          renderCuratedShelves();
        };

        wrapper.appendChild(starEl);
      }
    }

    function openMovieModal(m) {
      activeMovie = m;
      const modal = document.getElementById('movie-modal');
      
      document.getElementById('modal-title').textContent = m.title;
      document.getElementById('modal-banner').style.backgroundImage = `url('${m.img}')`;
      document.getElementById('modal-meta').innerHTML = `
        ${m.year} (${m.era}) &bull; Rated ${m.age} &bull; <strong>Style:</strong> ${m.style} &bull; 
        <strong>Genres:</strong> ${m.genres.join(', ')}
      `;
      document.getElementById('modal-score').textContent = `Predicted Affinity: ${computeMatchScore(m)}%`;
      document.getElementById('modal-desc').textContent = m.desc;

      renderModalStarRating(m);
      renderModalTags(m);
      modal.classList.add('active');
    }

    function renderModalTags(m) {
      const tagBox = document.getElementById('modal-tags-container');
      tagBox.innerHTML = '';
      m.tags.forEach(tag => {
        const isAdded = userPreferredTags.includes(tag);
        const tagEl = document.createElement('div');
        tagEl.className = `tag-badge ${isAdded ? 'added' : ''}`;
        tagEl.innerHTML = `${tag} ${isAdded ? '✓ Added' : '+ Add to Profile'}`;
        tagEl.onclick = () => {
          if (!isAdded) addPreferenceTag(tag);
          else removePreferenceTag(tag);
        };
        tagBox.appendChild(tagEl);
      });
    }

    function closeMovieModal() {
      activeMovie = null;
      document.getElementById('movie-modal').classList.remove('active');
    }

    initializeTagDropdown();
    renderPreferenceChips();
    runPrimarySearch();
    renderCuratedShelves();
  </script>
</body>
</html>
